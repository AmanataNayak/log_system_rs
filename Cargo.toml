[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/collector"
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"]}
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"]}
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
