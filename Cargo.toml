[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/collector",
    "crates/ingestion"
, "crates/query_engine"]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"]}
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"]}
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
tonic = "0.11"
prost = "0.12"
iceberg = "0.11.0"
iceberg-catalog-sql = "0.11.0"
sqlx = { version = "0.8", default-features = false, features = ["any", "postgres", "runtime-tokio"] }

