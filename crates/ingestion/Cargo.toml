[package]
name = "ingestion"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
tokio.workspace = true
tonic.workspace = true
prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.4", features = ["derive", "env"] }
serde_json = "1.0"
arrow = "58"
parquet = "58"
iceberg = "0.11.0"
iceberg-catalog-sql = "0.11.0"
sqlx = { version = "0.8", default-features = false, features = ["any", "postgres", "runtime-tokio"] }
anyhow = "1.0.104"
